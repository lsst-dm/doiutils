title: 'The LSST Science Pipelines Software: Optical Survey Pipeline Reduction and
  Analysis Environment'
handle: PSTN-019
site_url: https://pstn-019.lsst.io/
date: 2025-06-27
abstract: |-
  The NSF-DOE Vera C. Rubin Observatory is executing the Legacy Survey of Space
  and Time (LSST) as its prime mission,  producing a series of data releases
  over the ten-year survey. The LSST Science Pipelines Software will be used to
  create these data releases and to perform the nightly prompt processing and
  alert production. This paper provides an overview of the LSST Science
  Pipelines Software, describing the components and their integration into
  pipelines that generate science-ready data products.
